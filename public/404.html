<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <script>
      // Redirección SPA automática para GitHub Pages
      var pathname = window.location.pathname;
      var origin = window.location.origin;
      var parts = pathname.split('/').filter(Boolean);
      var repo = parts[0] || '';
      
      if (pathname.includes('/docs')) {
        window.location.replace(origin + '/' + repo + '/docs/');
      } else if (repo) {
        window.location.replace(origin + '/' + repo + '/');
      } else {
        window.location.replace('./');
      }
    </script>
  </head>
  <body style="background: #020617; color: #fef08a; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Cargando Flores Amarillas...</p>
  </body>
</html>
